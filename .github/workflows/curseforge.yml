# Upload a GitHub release's zip to CurseForge.
#
# Called by the Release workflow after the GitHub release exists. Also runs by
# hand (Actions > Upload to CurseForge > Run workflow) for any existing release,
# so a failed upload can be retried without rebuilding.
#
# Skipped, not failed, until both are set in the repo settings:
#   secret   CURSEFORGE_TOKEN       (CurseForge > API Tokens)
#   variable CURSEFORGE_PROJECT_ID  (from the project page)
name: Upload to CurseForge

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, like v0.6.0
        required: true

permissions:
  contents: read

jobs:
  upload:
    name: Upload
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Check CurseForge is set up
        id: gate
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ] || [ -z "$CURSEFORGE_PROJECT_ID" ]; then
            echo "::notice::CurseForge upload skipped. Set the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Get the zip and notes from the GitHub release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern "*.zip" --dir upload --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > release-notes.md
      - name: Upload to CurseForge
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/curseforge-upload.mjs --zip upload/*.zip --notes release-notes.md
