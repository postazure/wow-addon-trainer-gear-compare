<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Trainer Compare icon: two item tooltips side by side (equipped vs new, with
       green and red stat changes), and a crossed hammer and pick (the profession trainer) on top. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2b2f3d"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7a3"/>
      <stop offset="45%" stop-color="#e2b54f"/>
      <stop offset="100%" stop-color="#9c6b1f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#090c17"/>
    </linearGradient>
    <!-- Wood: shaded across the handle's width, light along the top edge. -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a220f"/>
      <stop offset="22%" stop-color="#b98450"/>
      <stop offset="48%" stop-color="#8a5a2e"/>
      <stop offset="100%" stop-color="#2c190a"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1709"/>
      <stop offset="25%" stop-color="#8e5f33"/>
      <stop offset="50%" stop-color="#65401f"/>
      <stop offset="100%" stop-color="#1f1106"/>
    </linearGradient>
    <!-- Bright steel for the hammer head. -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b646e"/>
      <stop offset="30%" stop-color="#eef2f6"/>
      <stop offset="55%" stop-color="#a7b1bc"/>
      <stop offset="100%" stop-color="#3c434b"/>
    </linearGradient>
    <linearGradient id="steelFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8dee5"/>
      <stop offset="100%" stop-color="#6f7882"/>
    </linearGradient>
    <!-- Dark iron for the pick head, lit along its outer edge. -->
    <linearGradient id="iron" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#9aa3ad"/>
      <stop offset="18%" stop-color="#525a63"/>
      <stop offset="60%" stop-color="#2b3036"/>
      <stop offset="100%" stop-color="#16191c"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e120a"/>
      <stop offset="40%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#140b05"/>
    </linearGradient>
    <!-- Painted look: fine noise multiplied over the tools, plus a soft shadow. -->
    <filter id="painted" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="grainIn"/>
      <feBlend in="SourceGraphic" in2="grainIn" mode="multiply" result="textured"/>
      <feDropShadow in="textured" dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="488" height="488" rx="72" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="72" fill="none" stroke="url(#gold)" stroke-width="16"/>

  <!-- Left tooltip: what you have equipped -->
  <g filter="url(#shadow)">
    <rect x="58" y="78" width="190" height="250" rx="16" fill="url(#panel)" stroke="#a9b0bd" stroke-width="7"/>
    <rect x="82" y="104" width="120" height="20" rx="10" fill="#f2f2f2"/>
    <rect x="82" y="148" width="142" height="14" rx="7" fill="#8f96a3"/>
    <rect x="82" y="182" width="112" height="14" rx="7" fill="#8f96a3"/>
    <rect x="82" y="216" width="130" height="14" rx="7" fill="#8f96a3"/>
  </g>

  <!-- Right tooltip: the recipe's item, with green and red stat changes -->
  <g filter="url(#shadow)">
    <rect x="264" y="58" width="190" height="250" rx="16" fill="url(#panel)" stroke="#a9b0bd" stroke-width="7"/>
    <rect x="288" y="84" width="120" height="20" rx="10" fill="#f2f2f2"/>
    <rect x="288" y="128" width="30" height="14" rx="7" fill="#2fe04a"/>
    <rect x="326" y="128" width="104" height="14" rx="7" fill="#d7dbe2"/>
    <rect x="288" y="162" width="30" height="14" rx="7" fill="#ff4545"/>
    <rect x="326" y="162" width="80" height="14" rx="7" fill="#d7dbe2"/>
    <rect x="288" y="196" width="30" height="14" rx="7" fill="#2fe04a"/>
    <rect x="326" y="196" width="94" height="14" rx="7" fill="#d7dbe2"/>
  </g>

  <!-- Crossed hammer and pick (the profession trainer), painted rather than flat.
       Each tool is drawn along a horizontal axis with its head at +x, then turned. -->
  <g transform="translate(256 356) scale(0.8)" filter="url(#painted)">
    <!-- Pick: handle lower right, curved iron head upper left. -->
    <g transform="rotate(-135)">
      <rect x="-165" y="-15" width="290" height="30" rx="13" fill="url(#woodDark)"/>
      <path d="M-150 -4 C-80 -7 -20 -2 100 -5" fill="none" stroke="#2a1709" stroke-width="2" opacity="0.6"/>
      <path d="M-140 5 C-60 3 0 7 105 4" fill="none" stroke="#c18f5c" stroke-width="1.5" opacity="0.35"/>
      <rect x="-165" y="-16" width="46" height="32" rx="12" fill="url(#leather)"/>
      <path d="M-158 -16 L-150 16 M-146 -16 L-138 16 M-134 -16 L-126 16" stroke="#0f0905" stroke-width="2" opacity="0.7"/>
      <!-- Head: a curved bar with points at both ends. -->
      <path d="M112 -20 C120 -62 110 -100 84 -132 L90 -136 C134 -106 150 -64 150 -20
               L150 20 C150 64 134 106 90 136 L84 132 C110 100 120 62 112 20 Z" fill="url(#iron)" stroke="#0d0f11" stroke-width="4" stroke-opacity="0.8" stroke-linejoin="round"/>
      <path d="M150 -18 C150 -62 134 -104 92 -134" fill="none" stroke="#d3d9df" stroke-width="3" opacity="0.65" stroke-linecap="round"/>
      <path d="M150 18 C150 62 134 104 92 134" fill="none" stroke="#c0c7ce" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
      <!-- Socket where the handle goes in -->
      <rect x="104" y="-24" width="52" height="48" rx="7" fill="#22262b"/>
      <rect x="108" y="-24" width="44" height="10" rx="4" fill="#7d8790" opacity="0.55"/>
      <circle cx="130" cy="2" r="5" fill="#9aa3ad"/>
    </g>
    <!-- Hammer: handle lower left, steel head upper right. Drawn last, so it crosses over the pick. -->
    <g transform="rotate(-45)">
      <rect x="-165" y="-16" width="285" height="32" rx="14" fill="url(#wood)"/>
      <path d="M-150 -5 C-70 -8 -10 -3 100 -6" fill="none" stroke="#3a220f" stroke-width="2" opacity="0.55"/>
      <path d="M-145 6 C-60 4 10 8 104 5" fill="none" stroke="#e0b07a" stroke-width="1.5" opacity="0.4"/>
      <rect x="-165" y="-17" width="48" height="34" rx="13" fill="url(#leather)"/>
      <path d="M-158 -17 L-150 17 M-146 -17 L-138 17 M-134 -17 L-126 17" stroke="#0f0905" stroke-width="2" opacity="0.7"/>
      <!-- Head: a steel block across the handle, with bevelled faces. -->
      <rect x="94" y="-70" width="82" height="140" rx="7" fill="url(#steel)"/>
      <rect x="94" y="-70" width="82" height="140" rx="7" fill="none" stroke="#1d2125" stroke-width="5" opacity="0.8"/>
      <rect x="97" y="-67" width="76" height="16" rx="5" fill="url(#steelFace)"/>
      <rect x="97" y="51" width="76" height="16" rx="5" fill="#4d555e"/>
      <path d="M120 -50 L120 50" stroke="#ffffff" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
      <path d="M100 -66 L170 -66" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <!-- Collar where the handle meets the head -->
      <rect x="80" y="-21" width="18" height="42" rx="4" fill="#4a525b"/>
      <rect x="80" y="-21" width="18" height="8" rx="3" fill="#9aa3ad" opacity="0.6"/>
    </g>
  </g>
</svg>
