<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Trainer Compare icon: two item tooltips side by side (equipped vs new, with
       green and red stat changes), and a rolled recipe scroll with a wax seal on top. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2b2f3d"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7a3"/>
      <stop offset="45%" stop-color="#e2b54f"/>
      <stop offset="100%" stop-color="#9c6b1f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#090c17"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8eac2"/>
      <stop offset="45%" stop-color="#e3c98f"/>
      <stop offset="100%" stop-color="#a98446"/>
    </linearGradient>
    <radialGradient id="paperEnd" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f3e2b3"/>
      <stop offset="100%" stop-color="#c9a764"/>
    </radialGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e6bd"/>
      <stop offset="100%" stop-color="#cfae6c"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f1c14"/>
      <stop offset="50%" stop-color="#d8392c"/>
      <stop offset="100%" stop-color="#8f1c14"/>
    </linearGradient>
    <radialGradient id="wax" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f05646"/>
      <stop offset="60%" stop-color="#c3271c"/>
      <stop offset="100%" stop-color="#7d1912"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="488" height="488" rx="72" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="72" fill="none" stroke="url(#gold)" stroke-width="16"/>

  <!-- Left tooltip: what you have equipped -->
  <g filter="url(#shadow)">
    <rect x="58" y="78" width="190" height="250" rx="16" fill="url(#panel)" stroke="#a9b0bd" stroke-width="7"/>
    <rect x="82" y="104" width="120" height="20" rx="10" fill="#f2f2f2"/>
    <rect x="82" y="148" width="142" height="14" rx="7" fill="#8f96a3"/>
    <rect x="82" y="182" width="112" height="14" rx="7" fill="#8f96a3"/>
    <rect x="82" y="216" width="130" height="14" rx="7" fill="#8f96a3"/>
  </g>

  <!-- Right tooltip: the recipe's item, with green and red stat changes -->
  <g filter="url(#shadow)">
    <rect x="264" y="58" width="190" height="250" rx="16" fill="url(#panel)" stroke="#a9b0bd" stroke-width="7"/>
    <rect x="288" y="84" width="120" height="20" rx="10" fill="#f2f2f2"/>
    <rect x="288" y="128" width="30" height="14" rx="7" fill="#2fe04a"/>
    <rect x="326" y="128" width="104" height="14" rx="7" fill="#d7dbe2"/>
    <rect x="288" y="162" width="30" height="14" rx="7" fill="#ff4545"/>
    <rect x="326" y="162" width="80" height="14" rx="7" fill="#d7dbe2"/>
    <rect x="288" y="196" width="30" height="14" rx="7" fill="#2fe04a"/>
    <rect x="326" y="196" width="94" height="14" rx="7" fill="#d7dbe2"/>
  </g>

  <!-- Recipe scroll, on top of everything: rolled parchment with a big spiral end,
       a torn flap at the far end, and a red wax seal with ribbons. Drawn along a
       horizontal axis, then turned to run lower-left to upper-right. -->
  <g filter="url(#shadow)">
    <g transform="translate(244 330) rotate(-33) scale(0.9)">
      <!-- Torn flap of paper at the far end -->
      <path d="M86 -40 L150 -58 L158 -44 L150 -34 L163 -22 L152 -10 L160 2 L118 16 L92 40 Z"
            fill="url(#flap)" stroke="#6b4d1e" stroke-width="5" stroke-linejoin="round"/>
      <!-- Tube, wider at the near (spiral) end -->
      <path d="M-112 -64 L96 -42 C110 -40 110 40 96 42 L-112 64 Z"
            fill="url(#tube)" stroke="#6b4d1e" stroke-width="5" stroke-linejoin="round"/>
      <!-- Ragged edge of the outer sheet -->
      <path d="M-70 -58 L-40 -50 L-46 -36 L-20 -30 L-28 -14 L4 -10 L-2 6 L30 8 L22 24 L60 30 L54 44"
            fill="none" stroke="#8a6a33" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-90 -50 C-20 -44 40 -38 90 -32" fill="none" stroke="#fff6d8" stroke-width="6"
            stroke-linecap="round" opacity="0.6"/>
      <!-- Near end with the spiral -->
      <ellipse cx="-112" cy="0" rx="44" ry="64" fill="url(#paperEnd)" stroke="#6b4d1e" stroke-width="5"/>
      <ellipse cx="-112" cy="0" rx="30" ry="44" fill="none" stroke="#7d5e2a" stroke-width="5"/>
      <path d="M-112 -30 C-92 -26 -92 24 -112 28 C-128 24 -128 -12 -112 -14 C-104 -10 -104 10 -112 12"
            fill="none" stroke="#7d5e2a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="-112" cy="0" rx="5" ry="8" fill="#5a4119"/>
    </g>
  </g>
  <!-- Ribbons hang straight down from the seal -->
  <g filter="url(#shadow)">
    <path d="M275 305 L267 401 L277 391 L285 405 L287 307 Z"
          fill="url(#ribbon)" stroke="#5e110c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M287 303 L293 387 L301 377 L311 389 L301 301 Z"
          fill="url(#ribbon)" stroke="#5e110c" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Wax seal -->
  <g filter="url(#shadow)">
    <circle cx="281" cy="291" r="25" fill="url(#wax)" stroke="#5e110c" stroke-width="5"/>
    <circle cx="281" cy="291" r="13" fill="none" stroke="#7d1912" stroke-width="4"/>
    <circle cx="274" cy="284" r="5" fill="#f07a6c" opacity="0.8"/>
  </g>
</svg>
