<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Trainer Compare icon: two item tooltips side by side (equipped vs new, with
       green and red stat changes), and a rolled recipe scroll on top. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2b2f3d"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7a3"/>
      <stop offset="45%" stop-color="#e2b54f"/>
      <stop offset="100%" stop-color="#9c6b1f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#090c17"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8eac2"/>
      <stop offset="45%" stop-color="#e3c98f"/>
      <stop offset="100%" stop-color="#a98446"/>
    </linearGradient>
    <radialGradient id="paperEnd" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f3e2b3"/>
      <stop offset="100%" stop-color="#c9a764"/>
    </radialGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d1912"/>
      <stop offset="50%" stop-color="#c8392d"/>
      <stop offset="100%" stop-color="#7d1912"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="488" height="488" rx="72" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="72" fill="none" stroke="url(#gold)" stroke-width="16"/>

  <!-- Left tooltip: what you have equipped -->
  <g filter="url(#shadow)">
    <rect x="58" y="78" width="190" height="250" rx="16" fill="url(#panel)" stroke="#a9b0bd" stroke-width="7"/>
    <rect x="82" y="104" width="120" height="20" rx="10" fill="#f2f2f2"/>
    <rect x="82" y="148" width="142" height="14" rx="7" fill="#8f96a3"/>
    <rect x="82" y="182" width="112" height="14" rx="7" fill="#8f96a3"/>
    <rect x="82" y="216" width="130" height="14" rx="7" fill="#8f96a3"/>
  </g>

  <!-- Right tooltip: the recipe's item, with green and red stat changes -->
  <g filter="url(#shadow)">
    <rect x="264" y="58" width="190" height="250" rx="16" fill="url(#panel)" stroke="#a9b0bd" stroke-width="7"/>
    <rect x="288" y="84" width="120" height="20" rx="10" fill="#f2f2f2"/>
    <rect x="288" y="128" width="30" height="14" rx="7" fill="#2fe04a"/>
    <rect x="326" y="128" width="104" height="14" rx="7" fill="#d7dbe2"/>
    <rect x="288" y="162" width="30" height="14" rx="7" fill="#ff4545"/>
    <rect x="326" y="162" width="80" height="14" rx="7" fill="#d7dbe2"/>
    <rect x="288" y="196" width="30" height="14" rx="7" fill="#2fe04a"/>
    <rect x="326" y="196" width="94" height="14" rx="7" fill="#d7dbe2"/>
  </g>

  <!-- Recipe scroll, on top of everything: rolled up and tied with a cord,
       like WoW's recipe/pattern/plans icons. -->
  <g filter="url(#shadow)" transform="rotate(-24 262 386)">
    <!-- Rolled tube -->
    <rect x="118" y="346" width="290" height="80" rx="40" fill="url(#tube)" stroke="#6b4d1e" stroke-width="5"/>
    <!-- Edge of the outer sheet, where it overlaps the roll -->
    <path d="M140 404 C210 396 300 396 392 404" fill="none" stroke="#8a6a33" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 366 C220 360 300 360 380 366" fill="none" stroke="#fff6d8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- Open end with the spiral -->
    <ellipse cx="404" cy="386" rx="22" ry="40" fill="url(#paperEnd)" stroke="#6b4d1e" stroke-width="5"/>
    <path d="M404 352 C424 360 424 412 404 420 C390 412 390 366 404 362 C416 368 416 404 404 410 C396 404 396 374 404 372"
          fill="none" stroke="#8a6a33" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cord tied round the middle -->
    <rect x="246" y="342" width="22" height="88" rx="6" fill="url(#cord)" stroke="#5e110c" stroke-width="4"/>
    <path d="M257 428 C246 448 236 462 222 474" fill="none" stroke="#a3231b" stroke-width="9" stroke-linecap="round"/>
    <path d="M257 428 C266 450 274 464 290 476" fill="none" stroke="#a3231b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="257" cy="428" r="10" fill="#c23a2f" stroke="#5e110c" stroke-width="4"/>
  </g>
</svg>
