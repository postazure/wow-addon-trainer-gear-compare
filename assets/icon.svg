<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Trainer Compare icon: a balance scale (compare) standing on an anvil (profession trainer). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#140d07"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7a3"/>
      <stop offset="45%" stop-color="#e2b54f"/>
      <stop offset="100%" stop-color="#9c6b1f"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa3ad"/>
      <stop offset="55%" stop-color="#5d656e"/>
      <stop offset="100%" stop-color="#2f343a"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="488" height="488" rx="72" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="72" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="34" y="34" width="444" height="444" rx="54" fill="none" stroke="#e2b54f" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Anvil -->
  <path d="M120 352 H352 C356 370 376 380 402 380 V398 H300 L284 418 H310 V438 H196 V418 H222 L206 398 H140 C124 398 116 380 120 352 Z"
        fill="url(#iron)" stroke="#1b1e22" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="352" width="232" height="10" fill="#c3cad1" opacity="0.6"/>

  <!-- Post and base of the scale -->
  <rect x="246" y="118" width="20" height="236" rx="6" fill="url(#gold)" stroke="#5a3d10" stroke-width="4"/>
  <rect x="206" y="332" width="100" height="22" rx="8" fill="url(#gold)" stroke="#5a3d10" stroke-width="4"/>

  <!-- Beam -->
  <rect x="104" y="128" width="304" height="18" rx="9" fill="url(#gold)" stroke="#5a3d10" stroke-width="4"/>
  <circle cx="256" cy="137" r="22" fill="url(#gold)" stroke="#5a3d10" stroke-width="4"/>
  <circle cx="256" cy="137" r="8" fill="#5a3d10"/>
  <path d="M244 98 L256 78 L268 98 Z" fill="url(#gold)" stroke="#5a3d10" stroke-width="4" stroke-linejoin="round"/>

  <!-- Chains -->
  <g stroke="#e2b54f" stroke-width="5" stroke-linecap="round">
    <line x1="118" y1="146" x2="80" y2="246"/>
    <line x1="118" y1="146" x2="156" y2="246"/>
    <line x1="394" y1="146" x2="356" y2="246"/>
    <line x1="394" y1="146" x2="432" y2="246"/>
  </g>

  <!-- Pans -->
  <path d="M64 244 H172 C168 286 140 300 118 300 C96 300 68 286 64 244 Z" fill="url(#gold)" stroke="#5a3d10" stroke-width="4" stroke-linejoin="round"/>
  <path d="M340 244 H448 C444 286 416 300 394 300 C372 300 344 286 340 244 Z" fill="url(#gold)" stroke="#5a3d10" stroke-width="4" stroke-linejoin="round"/>
</svg>
